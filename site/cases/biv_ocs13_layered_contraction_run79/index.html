<meta name="description" content="Run 79 (workstation, NORMAL TERMINATION at t 0.17): same loading as run 70 on the LAYERED OCS13 biventricular wall with papillary-muscle heads (57,457 tets, 2.6-2.8 elements through the RV wall, corrected fibre handedness), wall mass damping 1000 (run 70: 3000). OCS13 tricuspid valve tied to the wall; 84 real per-region Ogden chordae (trunk slack) whose tips are tied to the head poles, so they move with the wall. RV fill 0 → 4 mmHg (t 0-0.03, frames 0-9), hold to t 0.05, then leaflet, RV and trunk pressure 4 → 40 mmHg with active fibre tension T0 from the curve at P (t 0.05-0.15), hold to t 0.17. LV 8 mmHg. Frame k is the solver frame at t = 0.0034 k (51 frames, no interpolation). The RV volume is not held: RV + trunk 82.0 mL unloaded, 95.2 mL at the end of the 4 mmHg hold → 118.7 mL at 40 mmHg. Annulus area 1131.8 mm² unloaded → 1360.0 at the end. 58 of 84 chords loaded at the end, total 4.88 N, max 401 mN. Stress in kPa.">
