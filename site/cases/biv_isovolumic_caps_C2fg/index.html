<meta name="description" content="Posterior caps plus 97 zero-slack OCS12 chords from the PM tips to points spread over the tricuspid cap (681 rods). The RV outflow-tract wall contracts with T0 x 1.0 at the RV border falling to x 0.5 at the pulmonary valve (6 bands). This is the T0-pressure curve chosen for the valve runs. Fill to 4 mmHg (frames 0-24), then FEBio's volume constraint holds the RV + outflow volume while the active stress T0 ramps to 203 kPa (frames 24-48). Displacement only, no stress (the stress rerun is not finished). The cavity passes 40 mmHg near frame 35 (T0 94 kPa at 40 mmHg; Ag without chordae: 104) and ends at 74 mmHg. Volume held within 0.04 %.">
